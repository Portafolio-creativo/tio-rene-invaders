<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 30" width="76" height="30" shape-rendering="geometricPrecision">
  <!-- TIO RENE - MANDIBULA INFERIOR (pieza INDEPENDIENTE, se abre y cierra)
       El borde SUPERIOR (y=0) es el corte: encaja bajo player-head.svg.
       Reemplazable: manten el viewBox 76x30 y el borde superior plano. -->
  <path d="M2,2 L74,2 L74,12 Q74,28 38,28 Q2,28 2,12 Z" fill="#f4c99f" stroke="#21140d" stroke-width="3" stroke-linejoin="round"/>
  <!-- dientes inferiores colgando del borde de corte -->
  <g fill="#fffdf7" stroke="#21140d" stroke-width="1.4">
    <rect x="24" y="2" width="8" height="7" rx="1.5"/>
    <rect x="34" y="2" width="8" height="7" rx="1.5"/>
    <rect x="44" y="2" width="8" height="7" rx="1.5"/>
  </g>
  <!-- labio inferior -->
  <path d="M22,10 Q38,17 54,10 Q38,14 22,10 Z" fill="#c96a6a" stroke="#21140d" stroke-width="1.6"/>
  <!-- barba de tres dias -->
  <g fill="#6b5b4d" opacity="0.55">
    <circle cx="18" cy="18" r="1.3"/><circle cx="25" cy="21" r="1.3"/><circle cx="33" cy="23" r="1.3"/>
    <circle cx="43" cy="23" r="1.3"/><circle cx="51" cy="21" r="1.3"/><circle cx="58" cy="18" r="1.3"/>
    <circle cx="22" cy="24" r="1.1"/><circle cx="38" cy="25" r="1.1"/><circle cx="54" cy="24" r="1.1"/>
  </g>
  <!-- linea de corte superior -->
  <rect x="2" y="0" width="72" height="3" fill="#21140d"/>
</svg>
