<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 60" width="96" height="60" shape-rendering="geometricPrecision">
  <!-- TIO RENE - PARTE SUPERIOR DE LA CABEZA (expresion normal)
       Caricatura original hecha a partir de la referencia: cara ancha con
       papada, pelo corto entrecano, cejas gruesas fruncidas, ojos entornados
       con patas de gallo, nariz ancha y bulbosa, barba de tres dias.
       SIN BIGOTE.
       El borde INFERIOR (y=60) es el CORTE HORIZONTAL: los dientes de arriba
       cuelgan de el y encajan con player-jaw.svg. -->

  <!-- orejas grandes y despegadas -->
  <g stroke="#2a1c13" stroke-width="2.5">
    <ellipse cx="8" cy="38" rx="8" ry="11" fill="#dc9878"/>
    <ellipse cx="88" cy="38" rx="8" ry="11" fill="#dc9878"/>
    <path d="M8,33 Q11,38 8,43" fill="none" stroke-width="1.6"/>
    <path d="M88,33 Q85,38 88,43" fill="none" stroke-width="1.6"/>
  </g>

  <!-- cara ancha, mofletes bajos y borde inferior PLANO (linea de corte) -->
  <path d="M13,60 L11,34 Q11,6 48,6 Q85,6 85,34 L83,60 Z"
        fill="#e8a882" stroke="#2a1c13" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="17" cy="50" rx="8" ry="10" fill="#e8a882"/>
  <ellipse cx="79" cy="50" rx="8" ry="10" fill="#e8a882"/>

  <!-- pelo corto al ras, entrecano -->
  <path d="M10,32 Q9,5 48,4 Q87,5 86,32 Q86,21 78,16 Q64,11 48,11 Q32,11 18,16 Q10,21 10,32 Z"
        fill="#4a453e"/>
  <g fill="#b5b0a6">
    <path d="M22,14 q3,-5 7,-6 q-2,4 -3,7 Z"/>
    <path d="M36,10 q3,-6 8,-6 q-3,4 -4,7 Z"/>
    <path d="M52,10 q4,-6 9,-5 q-4,3 -5,7 Z"/>
    <path d="M66,13 q4,-5 9,-3 q-4,2 -6,6 Z"/>
    <path d="M13,26 q1,-7 5,-11 q-1,7 -1,11 Z"/>
    <path d="M83,26 q-1,-7 -5,-11 q1,7 1,11 Z"/>
  </g>
  <g fill="#ddd8cf">
    <path d="M29,8 q3,-4 7,-3 q-3,2 -4,5 Z"/>
    <path d="M59,8 q4,-3 8,-1 q-4,1 -6,4 Z"/>
    <path d="M74,19 q3,-3 6,0 q-4,0 -5,3 Z"/>
  </g>

  <!-- cejas muy gruesas, fruncidas hacia el centro -->
  <g fill="#3a332b">
    <path d="M18,23 Q30,18 44,27 L44,33 Q30,25 18,30 Z"/>
    <path d="M78,23 Q66,18 52,27 L52,33 Q66,25 78,30 Z"/>
  </g>
  <!-- entrecejo arrugado -->
  <g stroke="#c07a5e" stroke-width="1.6" stroke-linecap="round">
    <path d="M45,25 L44,31"/>
    <path d="M51,25 L52,31"/>
  </g>

  <!-- ojos entornados bajo las cejas -->
  <g stroke="#2a1c13" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M23,36 Q31,31 40,35"/>
    <path d="M73,36 Q65,31 56,35"/>
  </g>
  <g fill="#fffdf7">
    <path d="M25,36 Q31,33 38,36 Q31,38 25,36 Z"/>
    <path d="M71,36 Q65,33 58,36 Q65,38 71,36 Z"/>
  </g>
  <circle cx="31.5" cy="35.6" r="2" fill="#22303d"/>
  <circle cx="64.5" cy="35.6" r="2" fill="#22303d"/>
  <!-- patas de gallo -->
  <g stroke="#c07a5e" stroke-width="1.3" stroke-linecap="round">
    <path d="M20,33 L16,31 M20,36 L15,36 M20,39 L16,42"/>
    <path d="M76,33 L80,31 M76,36 L81,36 M76,39 L80,42"/>
  </g>

  <!-- nariz ancha y bulbosa, algo colorada -->
  <path d="M42,38 Q40,44 37,47" fill="none" stroke="#cf8a68" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M54,38 Q56,44 59,47" fill="none" stroke="#cf8a68" stroke-width="1.8" stroke-linecap="round"/>
  <ellipse cx="48" cy="46" rx="12" ry="8" fill="#e08a6e" stroke="#2a1c13" stroke-width="2.4"/>
  <ellipse cx="46" cy="43" rx="4" ry="2.6" fill="#f0a98d" opacity="0.85"/>
  <path d="M41,50 Q43,52 46,51" fill="none" stroke="#2a1c13" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M55,50 Q53,52 50,51" fill="none" stroke="#2a1c13" stroke-width="2.2" stroke-linecap="round"/>

  <!-- surcos de la mueca (nariz a comisuras) -->
  <g stroke="#c07a5e" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M36,48 Q31,54 30,60"/>
    <path d="M60,48 Q65,54 66,60"/>
  </g>

  <!-- barba de tres dias: sombra azulada en el labio superior y los lados -->
  <path d="M14,52 Q14,60 20,60 L76,60 Q82,60 82,52 Q65,56 48,56 Q31,56 14,52 Z"
        fill="#5d5f72" opacity="0.34"/>
  <g fill="#4a4c5e" opacity="0.5">
    <circle cx="30" cy="56" r="0.8"/><circle cx="36" cy="58" r="0.8"/>
    <circle cx="60" cy="56" r="0.8"/><circle cx="66" cy="58" r="0.8"/>
    <circle cx="24" cy="55" r="0.8"/><circle cx="72" cy="55" r="0.8"/>
  </g>

  <!-- labio superior y DIENTES DE ARRIBA colgando del corte -->
  <path d="M28,53 Q48,50 68,53 L68,55 Q48,52 28,55 Z" fill="#b8695e"/>
  <rect x="13" y="54" width="16" height="6" fill="#3a1c1a"/>
  <rect x="67" y="54" width="16" height="6" fill="#3a1c1a"/>
  <g fill="#ede4d0" stroke="#b09c78" stroke-width="0.7">
    <rect x="29" y="54" width="6.5" height="6"/>
    <rect x="35.5" y="54" width="6.5" height="6"/>
    <rect x="42" y="54" width="6.5" height="6"/>
    <rect x="48.5" y="54" width="6.5" height="6"/>
    <rect x="55" y="54" width="6.5" height="6"/>
    <rect x="61.5" y="54" width="6" height="6"/>
  </g>
  <rect x="28" y="53.5" width="40" height="1.6" fill="#8c5a52"/>
</svg>
