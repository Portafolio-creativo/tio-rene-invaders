<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src 'self' file: data:; media-src 'self' file: data:; connect-src 'self' file:; font-src 'self' file:; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="description" content="Tio Rene Invaders: arcade chileno de naves donde el Tio Rene dispara desde la mandibula.">
<title>TÍO RENÉ INVADERS</title>
<link rel="icon" href="assets/ui/favicon.png" type="image/png">
<!-- Instalable en la pantalla de inicio. Una app instalada arranca con el
     audio YA autorizado, asi que ahi el "ya llegamos ya" suena solo al abrir,
     sin tener que tocar nada. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/ui/icono-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tío René">

<!-- Miniatura al compartir el enlace (WhatsApp, Telegram, Facebook, X...).
     og:image tiene que ser una URL ABSOLUTA para que el previsualizador la
     lea; por eso apunta al dominio de publicacion. Si mueves el juego a otra
     URL, actualiza las cuatro lineas og:url / og:image / twitter:image. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tío René Invaders">
<meta property="og:title" content="TÍO RENÉ INVADERS">
<meta property="og:description" content="El Tío René defiende el barrio disparando desde la boca. Arcade chileno para tu navegador. ¡Juega gratis!">
<meta property="og:url" content="https://portafolio-creativo.github.io/tio-rene-invaders/">
<meta property="og:image" content="https://portafolio-creativo.github.io/tio-rene-invaders/assets/ui/og-cover.jpg">
<meta property="og:image:secure_url" content="https://portafolio-creativo.github.io/tio-rene-invaders/assets/ui/og-cover.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="La cara del Tío René junto al título Tío René Invaders">
<meta property="og:locale" content="es_CL">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="TÍO RENÉ INVADERS">
<meta name="twitter:description" content="El Tío René defiende el barrio disparando desde la boca. Arcade chileno para tu navegador.">
<meta name="twitter:image" content="https://portafolio-creativo.github.io/tio-rene-invaders/assets/ui/og-cover.jpg">
<meta name="theme-color" content="#070a14">
<link rel="stylesheet" href="css/style.css?v=202608271900">
</head>
<body>

<div id="app">

  <header id="cabecera">
    <p id="marca">TÍO RENÉ <span>INVADERS</span></p>
    <div id="controles-audio">
      <button type="button" id="btn-modo-control" class="tacto-sistema"
              aria-pressed="true" aria-label="Cambiar entre palanca y flechas">
        <span id="icono-modo">⇹</span>
      </button>
      <button type="button" id="btn-pausa-barra" class="tacto-sistema" data-accion="pausa" aria-label="Pausa">❚❚</button>
      <button type="button" id="btn-sonido" aria-pressed="true">SONIDO: SI</button>
      <label id="etiqueta-volumen" for="control-volumen">VOL</label>
      <input type="range" id="control-volumen" min="0" max="100" step="5" value="70" aria-label="Volumen">
    </div>
  </header>

  <main id="escenario">
    <div id="marco">
      <canvas id="lienzo" width="600" height="800" aria-label="Zona de juego de Tío René Invaders" role="img"></canvas>

      <!-- PORTADA: no hay boton de JUGAR. Al abrir, la cara entra desde el
           centro; en cuanto termina esa animacion aparece, desvanecido, el
           control de movimiento parpadeando para invitar a deslizar. El
           PRIMER movimiento del jugador es el que lanza la voz y arranca la
           partida: un solo gesto, sin pasos intermedios.
           Va sin "hidden" a proposito, para que el marco nunca se vea vacio
           mientras arranca el JavaScript. -->
      <section class="capa" id="capa-menu">
        <div id="intro-cara">
          <img id="intro-cabeza" src="assets/sprites/player-head.png" alt="" width="360" height="249">
          <div id="intro-boca"></div>
          <img id="intro-mandibula" src="assets/sprites/player-jaw.png" alt="" width="360" height="147">
        </div>
        <p id="invitacion" class="tenue">
          <span class="solo-tacto">Desliza el control para empezar</span>
          <span class="solo-teclado">Pulsa ← o → para empezar</span>
        </p>

        <!-- Instalar, a la vista desde el primer momento. No hay boton de
             "jugar online": entrar por el enlace YA es jugar online, y un
             boton de mas solo alarga el arranque. Solo aparece si el navegador
             de verdad puede instalar; si no, seria un boton que no hace nada. -->
        <div id="opciones-inicio">
          <button type="button" id="btn-instalar" class="opcion insignia" hidden>
            <span class="opcion-icono" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" role="img" aria-hidden="true">
                <path d="M6 8h12v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V8zm2.4-5.6 1 1.7A5.6 5.6 0 0 1 12 3.6c.9 0 1.8.2 2.6.5l1-1.7a.4.4 0 1 1 .7.4l-1 1.7A5.4 5.4 0 0 1 17.9 7H6.1a5.4 5.4 0 0 1 2.6-2.5l-1-1.7a.4.4 0 1 1 .7-.4zM9.4 5.4a.6.6 0 1 0 0-1.2.6.6 0 0 0 0 1.2zm5.2 0a.6.6 0 1 0 0-1.2.6.6 0 0 0 0 1.2zM3.8 8.6c.7 0 1.2.6 1.2 1.3v4.4a1.2 1.2 0 0 1-2.4 0V9.9c0-.7.5-1.3 1.2-1.3zm16.4 0c.7 0 1.2.6 1.2 1.3v4.4a1.2 1.2 0 0 1-2.4 0V9.9c0-.7.5-1.3 1.2-1.3zM9 21.2a1.2 1.2 0 0 1-2.4 0v-1.4H9v1.4zm8.4 0a1.2 1.2 0 0 1-2.4 0v-1.4h2.4v1.4z"/>
              </svg>
            </span>
            <span class="opcion-texto">
              <small>INSTALAR COMO</small>
              <b>APP DE ANDROID</b>
            </span>
          </button>
        </div>
        <p id="texto-carga" class="tenue">CARGANDO…</p>
      </section>

      <!-- PAUSA -->
      <section class="capa" id="capa-pausa" hidden>
        <h2 class="titulo-capa">PAUSA</h2>
        <button type="button" id="btn-reanudar" class="boton principal">SEGUIR</button>
        <button type="button" id="btn-menu-pausa" class="boton">MENÚ</button>
      </section>

      <!-- GAME OVER -->
      <section class="capa" id="capa-game-over" hidden>
        <h2 class="titulo-capa peligro">GAME OVER</h2>
        <p id="mensaje-final" class="lema"></p>
        <p class="marcador-menu">PUNTOS <strong id="puntos-final">00000</strong></p>
        <p class="marcador-menu">RÉCORD <strong id="record-final">00000</strong></p>
        <button type="button" id="btn-reintentar" class="boton principal">OTRA VEZ</button>
        <button type="button" id="btn-compartir" class="boton compartir">📤 COMPARTIR MI PUNTAJE</button>
        <button type="button" id="btn-menu-final" class="boton">MENÚ</button>
        <a class="boton apoyo" href="https://maladifusion.github.io/apoyo/"
           target="_blank" rel="noopener noreferrer">💛 Apoya al creador</a>
      </section>

      <!-- VICTORIA -->
      <section class="capa" id="capa-victoria" hidden>
        <h2 class="titulo-capa exito">¡VICTORIA!</h2>
        <p class="lema">El barrio quedó a salvo. Por ahora.</p>
        <p class="marcador-menu">PUNTOS <strong id="puntos-victoria">00000</strong></p>
        <button type="button" id="btn-seguir" class="boton principal">SEGUIR JUGANDO</button>
        <button type="button" id="btn-compartir-victoria" class="boton compartir">📤 COMPARTIR MI PUNTAJE</button>
        <button type="button" id="btn-menu-victoria" class="boton">MENÚ</button>
        <a class="boton apoyo" href="https://maladifusion.github.io/apoyo/"
           target="_blank" rel="noopener noreferrer">💛 Apoya al creador</a>
      </section>
    </div>
  </main>

  <!-- Controles tactiles. En vertical: fila 1 = izquierda + derecha (pegados,
       mitad y mitad); fila 2 = disparo a todo el ancho. La pausa vive en la
       barra de arriba. En horizontal se reacomodan a los lados (ver CSS). -->
  <!-- Controles tactiles. Cada zona lleva DENTRO su interruptor de modo, para
       poder cambiarlo en plena partida sin ir al menu:
         fila 1: palanca (o las dos flechas) + boton para alternar entre ambas
         fila 2: DISPARO + boton AUTO para fijar el disparo -->
  <!-- Controles tactiles. Las dos zonas miden EXACTAMENTE lo que el tablero
       (el ancho lo fija main.js en --ancho-tablero), para que el recorrido del
       dedo en la palanca coincida con el del personaje en pantalla. Por eso no
       hay ningun boton a los costados que les robe ancho. -->
  <div id="botonera" aria-label="Controles táctiles">

    <div id="zona-mover">
      <div id="palanca" role="group" aria-label="Palanca de movimiento">
        <span class="palanca-flecha izq" aria-hidden="true">◀</span>
        <span class="palanca-flecha der" aria-hidden="true">▶</span>
        <span id="palanca-mando" aria-hidden="true"></span>
      </div>
      <button type="button" class="tacto" data-accion="izquierda" aria-label="Mover a la izquierda">◀</button>
      <button type="button" class="tacto" data-accion="derecha" aria-label="Mover a la derecha">▶</button>
    </div>

    <!-- El disparo lleva DENTRO una casilla: al marcarla el disparo pasa a
         automatico; el resto del boton sigue disparando a mano. -->
    <div id="zona-disparo">
      <button type="button" class="tacto disparo" data-accion="disparo" aria-label="Disparar">
        <span id="texto-disparo">DISPARO</span>
      </button>
      <button type="button" id="btn-modo-auto" class="casilla-auto"
              aria-pressed="false" aria-label="Disparo automático">
        <span class="marca" aria-hidden="true">✓</span>
        <span class="rotulo" aria-hidden="true">AUTO</span>
      </button>
    </div>

  </div>

  <p id="ayuda-instalar" class="aviso" hidden></p>
  <p id="aviso-almacenamiento" class="aviso" hidden></p>

  <footer id="pie">
    <span>Un juego de <b>Eduardo Pérez</b></span>
    <a href="https://maladifusion.github.io/apoyo/" target="_blank" rel="noopener noreferrer">💛 Apoya mi trabajo</a>
  </footer>

</div>

<p id="estado-accesible" class="oculto-visual" aria-live="polite"></p>

</body>
